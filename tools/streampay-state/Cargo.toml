[package]
name = "streampay-state"
version = "0.1.0"
edition = "2021"
description = "StreamPay state backup, verification, and sandbox-replay CLI tool."
license = "Apache-2.0"

[[bin]]
name = "streampay-state"
path = "src/main.rs"

[dependencies]
# Soroban XDR types (pinned to the same version family the locked
# soroban-env-common 29 already resolves).
stellar-xdr = { version = "30.0.0", features = ["base64"] }
# Stellar StrKey (G…/C… address encoding)
stellar-strkey = "1.0.0"
# HTTP client for Soroban RPC calls (blocking)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# JSON serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CLI argument parsing
clap = { version = "4", features = ["derive"] }
# Hex utilities (base64 comes via stellar-xdr's `base64` feature; the
# standalone base64 0.23 dep was unused and duplicated the 0.22 copy the
# rest of the workspace resolves — cargo-deny bans flagged the pair)
hex = "0.4"
# SHA-256 for schema fingerprint
sha2 = "0.11"
# Error handling
anyhow = "1"

[dev-dependencies]
# Validates emitted verify reports against json-schema-v1.json (tests only).
jsonschema = { version = "0.61", default-features = false }
